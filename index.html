<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notas Fácil</title>

<style>
:root{
--primary:#6366F1;
--accent:#22D3EE;
--bg:#0F172A;
--card:#1E293B;
--text:#F1F5F9;
--muted:#94A3B8;
--radius:16px;
}

body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#0F172A,#111827);
color:var(--text);
display:flex;
align-items:center;
justify-content:center;
height:100vh;
}

.card{
background:var(--card);
padding:40px;
border-radius:var(--radius);
width:100%;
max-width:400px;
text-align:center;
box-shadow:0 10px 40px rgba(0,0,0,0.5);
}

h1{
margin-bottom:10px;
}

p{
color:var(--muted);
font-size:14px;
}

input{
width:100%;
padding:12px;
margin-top:20px;
border-radius:8px;
border:none;
outline:none;
font-size:15px;
}

button{
margin-top:20px;
width:100%;
padding:14px;
border:none;
border-radius:var(--radius);
font-weight:bold;
font-size:16px;
cursor:pointer;
background:linear-gradient(90deg,var(--primary),var(--accent));
color:white;
transition:0.3s;
}

button:hover{
transform:translateY(-2px);
}

#appArea{
display:none;
text-align:center;
}

#modalPagamento{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.85);
align-items:center;
justify-content:center;
z-index:999;
}

.modal-box{
background:var(--card);
padding:40px;
border-radius:20px;
text-align:center;
max-width:400px;
}
</style>
</head>

<body>

<div class="card" id="loginCard">
<h1>Notas Fácil</h1>
<p>Teste grátis por 2 dias. Sem cartão.</p>

<input type="email" id="emailInput" placeholder="Seu e-mail">

<button onclick="login()">
🚀 Iniciar teste grátis
</button>
</div>

<div id="appArea">
<h1>✅ Acesso Liberado</h1>
<p>Bem-vindo ao seu painel.</p>
</div>

<!-- MODAL PAGAMENTO -->
<div id="modalPagamento">
  <div class="modal-box">
    <h2>🔒 Teste Expirado</h2>
    <p>Seu período de 48h terminou.</p>

    <button onclick="assinar()">
    💳 Assinar agora — R$ 15,99/mês
    </button>
  </div>
</div>

<script>
async function login(){
  const email = document.getElementById("emailInput").value.trim();

  if(!email){
    alert("Digite seu email");
    return;
  }

  try{
    // Chama backend para iniciar login / trial
    const res = await fetch("/api/login", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ email })
    });

    const data = await res.json();

    if(data.access === "bloqueado"){
      mostrarModalPagamento();
      return;
    }

    liberarApp();

  }catch(err){
    console.error(err);
    alert("Erro ao conectar ao servidor.");
  }
}

async function verificarStatus(email){
  const res = await fetch(`/api/status?email=${encodeURIComponent(email)}`);
  const data = await res.json();

  if(data.access === "bloqueado"){
    mostrarModalPagamento();
  }
}

function liberarApp(){
  document.getElementById("loginCard").style.display="none";
  document.getElementById("appArea").style.display="block";
}

function mostrarModalPagamento(){
  document.getElementById("modalPagamento").style.display="flex";
}

function assinar(){
  window.location.href="/checkout";
}
</script>

</body>
</html>
