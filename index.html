<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">

<title>Notas$fácil — Nota de Serviço para Autônomos</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00C896">

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
--verde:#00C896;
--preto:#0D1117;
--cinza:#8899AA;
--radius:14px;
}

body{
margin:0;
font-family:'Sora',sans-serif;
background:var(--preto);
color:white;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:16px;
background:#0d1117;
border-bottom:1px solid rgba(255,255,255,0.05);
}

.logo{
font-weight:700;
color:var(--verde);
}

.btn-primary{
background:var(--verde);
border:none;
padding:10px 18px;
border-radius:8px;
font-weight:600;
cursor:pointer;
}

.hero{
padding:120px 20px 60px;
text-align:center;
max-width:900px;
margin:auto;
}

.hero h1{
font-size:42px;
margin-bottom:20px;
}

.hero p{
color:var(--cinza);
max-width:600px;
margin:auto;
}

.btn-hero{
margin-top:30px;
padding:16px 28px;
font-size:16px;
border:none;
border-radius:var(--radius);
background:var(--verde);
cursor:pointer;
font-weight:700;
}

.section{
padding:80px 20px;
max-width:1000px;
margin:auto;
}

.mobile-nav{
display:none;
}

@media(max-width:768px){
.mobile-nav{
display:flex;
position:fixed;
bottom:0;
left:0;
right:0;
background:#111;
border-top:1px solid rgba(255,255,255,0.08);
justify-content:space-around;
padding:8px 0;
z-index:999;
}

.mobile-nav button{
background:none;
border:none;
color:white;
font-size:22px;
}

body{
padding-bottom:70px;
}
}
</style>
</head>

<body>

<nav>
<div class="logo">Notas$fácil</div>
<button class="btn-primary" data-action="abrir-app">
🔐 Acessar Minhas Notas
</button>
</nav>

<div class="hero">
<h1>Sua nota de serviço em segundos.</h1>
<p>Emita notas profissionais, calcule impostos automaticamente e organize suas finanças.</p>

<button class="btn-hero" data-action="abrir-app">
🚀 Criar minha primeira nota grátis
</button>

<p style="margin-top:16px;color:var(--cinza);font-size:14px">
✅ Mais de 1.000 notas já emitidas por autônomos
</p>
</div>

<!-- APP ROOT -->
<div id="app"></div>

<!-- Mobile Navigation -->
<div class="mobile-nav">
<button data-action="view" data-view="emitir">🧾</button>
<button data-action="view" data-view="historico">📋</button>
<button data-action="view" data-view="financas">📊</button>
<button data-action="view" data-view="perfil">👤</button>
</div>

<script src="js/config.js"></script>
<script src="js/crypto.js"></script>
<script src="js/storage.js"></script>
<script src="js/trial.js"></script>
<script src="js/app.js"></script>
<script src="js/drive.js"></script>
<script src="js/events.js"></script>

<script>
if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
